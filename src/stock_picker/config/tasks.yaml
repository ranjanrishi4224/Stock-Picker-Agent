find_trending_companies:
  description: >
    Search the latest financial news and market updates as of {current_date}
    to identify 2–3 publicly traded companies that are currently trending
    in the {sector} sector. Prioritize companies with significant news,
    earnings announcements, mergers, acquisitions, product launches,
    analyst upgrades, or other major developments. Avoid selecting
    companies that were chosen in previous executions.

  expected_output: >
    A JSON file containing 2–3 trending companies with their ticker symbols,
    industry, a brief explanation of why they are trending, and links or
    references to the news sources.

  agent: trending_company_finder

  output_file: output/trending_companies.json


research_trending_companies:
  description: >
    Using the identified companies, perform comprehensive financial research
    with information available as of {current_date}. Analyze each company's
    business model, financial performance, competitive advantages,
    recent developments, growth opportunities, valuation, and investment risks.

  expected_output: >
    A structured JSON report containing detailed research for each company,
    including strengths, weaknesses, opportunities, risks, and an overall
    investment outlook.

  agent: financial_researcher

  context:
    - find_trending_companies

  output_file: output/research_report.json


pick_best_company:
  description: >
    Analyze the research findings and determine the single best company for
    investment using the latest available information as of {current_date}.

    Before generating the final report, use the Email tool to send a
    professional email to the user.

    The email should include:

    Subject:
    Investment Recommendation - {current_date}

    Body:
    - A professional greeting.
    - The name and ticker symbol of the recommended company.
    - A concise executive summary (2-3 sentences) explaining why this company
      was selected.
    - Three to five bullet points highlighting the company's key strengths.
    - A brief paragraph describing the primary investment risks.
    - A one-sentence disclaimer stating that the recommendation is based on
      publicly available information and is not financial advice.
    - A professional closing.

    After successfully sending the email, generate a comprehensive Markdown
    report that includes:
    - Executive Summary
    - Recommended Company
    - Investment Thesis
    - Financial Analysis
    - Growth Opportunities
    - Risk Analysis
    - Comparison with the other researched companies
    - Reasons the other companies were not selected
    - Final Investment Recommendation

  expected_output: >
    A detailed Markdown investment report. The email should be sent using the
    Email tool before the report is returned.

  agent: stock_picker

  context:
    - research_trending_companies

  output_file: output/decision.md
