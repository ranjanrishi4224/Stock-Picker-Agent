find_trending_companies:
  description: >
    Search the latest financial news and market updates as of {current_date}
    to identify the 2-3 most trending publicly traded companies in the
    {sector} sector.

    Prioritize companies making headlines because of:
    - Earnings announcements
    - AI developments
    - Product launches
    - Mergers or acquisitions
    - Strategic partnerships
    - Regulatory announcements
    - Analyst upgrades or downgrades
    - Other significant market-moving events

    For each company include:
    - Company name
    - Stock ticker
    - Industry
    - Why the company is trending
    - A concise summary of the latest news

    Use only recent and reliable sources.
    Do not invent companies or news.

  expected_output: >
    A well-formatted Markdown report containing 2-3 trending companies,
    their ticker symbols, industries, news summaries, and reasons for trending.

  agent: trending_company_finder

  output_file: output/trending_companies.md


research_trending_companies:
  description: >
    Using the companies identified previously, perform comprehensive
    investment research using the latest publicly available information.

    For each company include:

    - Company overview
    - Business model
    - Revenue and profitability
    - Financial performance
    - Competitive advantages
    - Industry position
    - Recent developments
    - Growth opportunities
    - Key investment risks
    - Overall investment outlook

    Support your analysis with current information and present a balanced,
    objective assessment.

  expected_output: >
    A comprehensive Markdown research report for each company.

  agent: financial_researcher

  context:
    - find_trending_companies

  output_file: output/research_report.md


pick_best_company:
  description: >
    Review all research findings and identify the strongest long-term
    investment opportunity.

    Compare the companies based on:

    - Financial strength
    - Revenue growth
    - Profitability
    - Competitive advantages
    - Industry leadership
    - Future growth potential
    - Recent developments
    - Valuation
    - Investment risks

    Select the single best company and clearly justify your decision.

    Generate a professional investment report containing:

    - Executive Summary
    - Recommended Company
    - Stock Ticker
    - Company Overview
    - Investment Thesis
    - Financial Analysis
    - Growth Opportunities
    - Competitive Advantages
    - Key Risks
    - Comparison with the other researched companies
    - Reasons the remaining companies were not selected
    - Final Investment Recommendation

    The report should be professional, well-structured, and written in Markdown.

  expected_output: >
    A comprehensive Markdown investment report recommending the best company
    for investment. Save the report as output/decision.md.

  agent: stock_picker

  context:
    - research_trending_companies

  output_file: output/decision.md